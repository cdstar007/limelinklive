name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on VPS
        run: |
          set -e
          cd /home/ubuntu/limelinklive
          git fetch origin
          git reset --hard origin/main
          npm ci
          npm run build:server
          pm2 startOrReload ecosystem.config.cjs --only limelinklive
          pm2 save
